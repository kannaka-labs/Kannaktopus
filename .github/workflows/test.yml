name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Nightly builds at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Make scripts executable
        run: |
          chmod +x scripts/orchestrate.sh
          chmod +x scripts/sync-marketplace.sh
          chmod +x tests/**/*.sh
          find tests -name "*.sh" -type f -exec chmod +x {} \;

      - name: Verify marketplace.json is up to date
        run: ./scripts/sync-marketplace.sh --check

      - name: Run smoke tests
        run: make test-smoke

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-logs
          path: /tmp/test_*.log
          retention-days: 7

  mcp-server:
    name: MCP Server Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # .mcp.json launches the COMMITTED mcp-server/dist/index.js, so a change to
    # mcp-server/src/ that is not rebuilt into dist/ ships nothing. This job
    # type-checks the source and fails when a fresh build differs from dist/.
    # typescript is pinned to an exact version in mcp-server/package.json so
    # the emitted JS is reproducible without a lockfile.
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: mcp-server
        run: npm install --no-audit --no-fund

      - name: Type-check
        working-directory: mcp-server
        run: npx --no-install tsc --noEmit

      - name: Build
        working-directory: mcp-server
        run: npm run build

      - name: Fail if committed dist/ is stale
        run: |
          if ! git diff --exit-code --stat -- mcp-server/dist; then
            echo "::error::mcp-server/dist is out of date with mcp-server/src. Run 'npm run build' in mcp-server/ and commit dist/."
            exit 1
          fi
          untracked=$(git ls-files --others --exclude-standard -- mcp-server/dist)
          if [ -n "$untracked" ]; then
            echo "::error::the build emits files that are not committed: $untracked"
            exit 1
          fi

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: smoke

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Make scripts executable
        run: |
          chmod +x scripts/orchestrate.sh
          chmod +x tests/**/*.sh
          find tests -name "*.sh" -type f -exec chmod +x {} \;

      - name: Run unit tests
        run: make test-unit

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: test-results*.xml
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-logs
          path: /tmp/test_*.log
          retention-days: 7

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Make scripts executable
        run: |
          chmod +x scripts/orchestrate.sh
          chmod +x tests/**/*.sh
          find tests -name "*.sh" -type f -exec chmod +x {} \;

      - name: Run integration tests
        run: make test-integration

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: test-results*.xml
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-logs
          path: /tmp/test_*.log
          retention-days: 7

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [smoke, unit, integration]
    # Only run E2E on main branch, scheduled builds, or manual trigger
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Make scripts executable
        run: |
          chmod +x scripts/orchestrate.sh
          chmod +x tests/**/*.sh
          find tests -name "*.sh" -type f -exec chmod +x {} \;

      - name: Run E2E tests
        run: make test-e2e
        env:
          # Add any necessary API keys or credentials here
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: test-results*.xml
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-logs
          path: /tmp/test_*.log
          retention-days: 7

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [smoke, unit, integration, mcp-server]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Create test summary
        run: |
          echo "# Kannaktopus Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Category | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke | ${{ needs.smoke.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit | ${{ needs.unit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration | ${{ needs.integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| MCP Server Build | ${{ needs.mcp-server.result }} |" >> $GITHUB_STEP_SUMMARY

      # Without this the job only PRINTS the results and always exits 0, so the
      # "Test Summary" check reports success next to a failing Smoke Tests in the
      # same run. `skipped` stays acceptable: integration and e2e are gated by
      # `if:` conditions and legitimately skip on most events.
      - name: Fail when a dependency did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::Test Summary is red because a dependency did not succeed - smoke=${{ needs.smoke.result }}, unit=${{ needs.unit.result }}, integration=${{ needs.integration.result }}, mcp-server=${{ needs.mcp-server.result }}"
          exit 1
